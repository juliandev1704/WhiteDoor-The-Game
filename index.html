<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b1730">
  <title>White Door — Music Studio Tycoon</title>
  <meta name="description" content="White Door: un juego tycoon 8-bit de estudio musical. Desarrollado por Julian Camilo Forero Daza.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="tb-left">
        <div id="t-logo" class="logo">WHITE DOOR</div>
        <div class="tb-date"><span id="t-date"></span><span id="t-trend" class="muted"></span></div>
      </div>
      <div class="tb-stats">
        <div class="stat-pill" title="Dinero" data-icon="coin"><span id="t-money"></span></div>
        <div class="stat-pill" title="Fans" data-icon="fans"><span id="t-fans"></span></div>
        <div class="stat-pill" title="Prestigio" data-icon="star"><span id="t-prestige"></span><span id="t-title" class="muted"></span></div>
        <div class="stat-pill lvl" title="Nivel de productor"><span id="t-level"></span><div class="xpbar"><div id="t-xp"></div></div></div>
      </div>
      <div class="speed">
        <button data-speed="0" title="Pausa (Espacio)">II</button>
        <button data-speed="1" title="Velocidad 1x (1)">1x</button>
        <button data-speed="2" title="Velocidad 2x (2)">2x</button>
        <button data-speed="4" title="Velocidad 4x (3)">4x</button>
      </div>
    </header>

    <main id="stage">
      <div id="screen">
        <canvas id="scene" width="320" height="180"></canvas>
        <div id="fx"></div>
        <div id="devpanel" hidden></div>
        <div id="needs">
          <div class="need"><span>Energía</span><i><em id="n-energia"></em></i><b id="v-energia"></b></div>
          <div class="need"><span>Hambre</span><i><em id="n-hambre"></em></i><b id="v-hambre"></b></div>
          <div class="need"><span>Ánimo</span><i><em id="n-animo"></em></i><b id="v-animo"></b></div>
          <div class="need"><span>Salud</span><i><em id="n-salud"></em></i><b id="v-salud"></b></div>
          <div id="n-insp" class="insp" hidden>Inspirado</div>
          <div id="needs-actions">
            <button data-home="sleep" title="Dormir">Dormir</button>
            <button data-home="eat" title="Comer de la nevera">Comer</button>
            <button data-home="relax" title="Relajarte un rato">Relajar</button>
          </div>
        </div>
        <div id="viewnav" hidden>
          <button id="nav-prev" aria-label="Cuarto anterior">◀</button>
          <span id="view-name"></span>
          <button id="nav-next" aria-label="Cuarto siguiente">▶</button>
        </div>
        <button id="prompt" hidden></button>
        <div id="dpad" hidden>
          <button data-dir="up" aria-label="Arriba">▲</button>
          <button data-dir="left" aria-label="Izquierda">◀</button>
          <button data-dir="down" aria-label="Abajo">▼</button>
          <button data-dir="right" aria-label="Derecha">▶</button>
          <p class="dpad-hint">Toca el mapa para caminar hasta allá, o usa las flechas.</p>
        </div>
        <div id="fade"></div>
      </div>
    </main>

    <nav id="actions">
      <button id="b-song" data-short="Canción" class="act primary"><span>Nueva canción</span></button>
      <button id="b-inbox" data-short="Bandeja" class="act"><span>Bandeja</span><em class="badge" hidden></em></button>
      <button id="b-city" data-short="Ciudad" class="act"><span>Ciudad</span></button>
      <button id="b-goals" data-short="Objetivos" class="act"><span>Objetivos</span><em class="badge" hidden></em></button>
      <button id="b-jobs" data-short="Trabajos" class="act"><span>Trabajos</span></button>
      <button id="b-label" data-short="Sello" class="act"><span>Sello</span><em class="badge" hidden></em></button>
      <button id="b-staff" data-short="Personal" class="act"><span>Personal</span></button>
      <button id="b-life" data-short="Vida" class="act"><span>Vida</span></button>
      <button id="b-producer" data-short="Productor" class="act"><span>Productor</span><em class="badge" hidden></em></button>
      <button id="b-disco" data-short="Discos" class="act"><span>Discografía</span></button>
      <button id="b-menu" data-short="Menú" class="act"><span>Menú</span></button>
    </nav>
  </div>

  <div id="title-screen" hidden>
    <div class="title-box">
      <div class="title-logo">WHITE<br>DOOR</div>
      <div class="title-sub">Music Studio Tycoon</div>
      <label class="title-label" for="title-name">Nombre del productor</label>
      <input id="title-name" maxlength="20" value="Julian">
      <div class="title-buttons">
        <button id="btn-continue" class="btn primary" hidden>Continuar</button>
        <button id="btn-new" class="btn primary">Nueva partida</button>
      </div>
      <div class="credits">Desarrollado por<br><b>Julian Camilo Forero Daza</b></div>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toasts"></div>

  <script src="js/data.js"></script>
  <script src="js/data2.js"></script>
  <script src="js/render.js"></script>
  <script src="js/modules.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/game.js"></script>
  <script src="js/life.js"></script>
  <script src="js/label.js"></script>
  <script src="js/world.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/ui2.js"></script>
  <script src="js/extras.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
